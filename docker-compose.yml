services:
  db:
    image: pgvector/pgvector:pg16
    container_name: entro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: entro
      POSTGRES_PASSWORD: entro
      POSTGRES_DB: entro
    ports:
      - "5432:5432"
    volumes:
      - entro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entro -d entro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  entro_pgdata:
