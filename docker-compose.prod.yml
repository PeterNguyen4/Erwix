services:
  db:
    image: pgvector/pgvector:pg16
    container_name: erwix-db
    restart: always
    environment:
      POSTGRES_USER: erwix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erwix
    volumes:
      - erwix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erwix -d erwix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: erwix-redis
    restart: always
    volumes:
      - erwix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: erwix-backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://erwix:${POSTGRES_PASSWORD}@db:5432/erwix
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: erwix-cloudflared
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  erwix_pgdata:
  erwix_redisdata:
