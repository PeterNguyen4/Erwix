services:
  db:
    image: pgvector/pgvector:pg16
    container_name: erwix-db
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: erwix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erwix
    volumes:
      - erwix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erwix -d erwix"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 300m

  redis:
    image: redis:7-alpine
    container_name: erwix-redis
    restart: always
    command: redis-server --maxmemory 80mb --maxmemory-policy allkeys-lru
    volumes:
      - erwix_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 100m

  backend:
    image: ghcr.io/peternguyen4/erwix-backend:latest
    container_name: erwix-backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://erwix:${POSTGRES_PASSWORD}@db:5432/erwix
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 450m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: erwix-cloudflared
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    mem_limit: 64m

volumes:
  erwix_pgdata:
  erwix_redisdata:
