[project]
name = "entro-backend"
version = "0.1.0"
description = "Entro multi-agent trading system — backend (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alpaca-py>=0.33",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "pgvector>=0.3",
    "voyageai>=0.3",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
